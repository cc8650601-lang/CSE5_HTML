<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Schedule</title>
  <style>
    table {
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #888;
      padding: 8px;
      text-align: left;
    }

    th {
      text-align: center;
    }

    .batches th, .batches td {
      padding: 6px;
    }
  </style>
</head>
<body>

<table>
  <thead>
    <tr>
      <th rowspan="2">Day</th>
      <th colspan="2">Lab Batches</th>
      <th rowspan="2">Faculty</th>
      <th rowspan="2">Room</th>
      <th rowspan="2">Time</th>
    </tr>
    <tr>
      <th>Batch</th>
      <th>System</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td rowspan="2">Friday</td>
      <td colspan="2" rowspan="2">
        <table class="batches">
          <thead>
            <tr>
              <th>Batch</th>
              <th>System</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>A1</td>
              <td>PC 1-20</td>
            </tr>
            <tr>
              <td>A2</td>
              <td>PC 21-40</td>
            </tr>
          </tbody>
        </table>
      </td>
      <td rowspan="2">Dr. Sharma</td>
      <td rowspan="2">Lab 2</td>
      <td rowspan="2">2-4 PM</td>
    </tr>
    <tr></tr>
  </tbody>
</table>

</body>
</html>
