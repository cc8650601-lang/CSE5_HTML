<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Block and Inline Elements</title>
        <style>
            .block {
                display: block;
                background: #b7e1f0;
                margin: 4px 0;
                padding: 5px;
            }
            .inline {
                background: #b8e6c1;
            }
        </style>
    </head>
    <body>
        <h1>Block and Inline Elements</h1>
        <div class="block">Block 1 (div)</div>
        <div class="block">Block 2 (div)</div>
        <p> <span class="inline">Inline 1</span> <span class="inline">Inline 2</span> <span class="inline">Inline 3</span>.</p>
    </body>
</html>
