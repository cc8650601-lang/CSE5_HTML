<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC College Admission 2026</title>

  <style>
    body {
      width: 520px;
      margin: 0 auto;
      font-family: "Times New Roman", serif;
      border: 1px solid #ccc;
    }

    header {
      background-color: #202a80;
      color: white;
      text-align: center;
      padding: 8px;
    }

    main {
      padding: 0 69px 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    caption {
      padding-bottom: 0;
    }

    th, td {
      border: 1px solid #aaa;
      padding: 4px;
    }

    th {
      background-color: #e8e9f2;
    }

    fieldset {
      margin-top: 10px;
      padding: 8px 10px;
    }

    .field {
      margin-bottom: 12px;
    }

    input[type="text"],
    input[type="email"] {
      width: 175px;
      height: 13px;
    }

    select {
      width: 86px;
    }

    textarea {
      width: 315px;
      height: 44px;
    }

    footer {
      background-color: #202a80;
      color: white;
      text-align: center;
      padding: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1 style="margin: 0; font-size: 26px;">ABC College Admission 2026</h1>
  </header>

  <main>
    <h2>Courses and Fees</h2>

    <table>
      <caption>Available Courses</caption>
      <thead>
        <tr>
          <th>Course</th>
          <th>Seats</th>
          <th>Fees</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>B.Tech CSE</td>
          <td>120</td>
          <td>₹90,000</td>
        </tr>
        <tr>
          <td>BCA</td>
          <td>60</td>
          <td>₹45,000</td>
        </tr>
      </tbody>
    </table>

    <form action="#" method="post">
      <fieldset>
        <legend>Application Form</legend>

        <div class="field">
          <label for="name">Name:</label><br>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="field">
          <label for="email">Email:</label><br>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="field">
          <label for="course">Course:</label><br>
          <select id="course" name="course">
            <option>B.Tech CSE</option>
            <option>BCA</option>
          </select>
        </div>

        <div class="field">
          <label for="statement">Statement:</label><br>
          <textarea id="statement" name="statement"></textarea>
        </div>

        <button type="submit">Apply</button>
      </fieldset>
    </form>
  </main>

  <footer>
    © 2026 ABC College
  </footer>

</body>
</html>
